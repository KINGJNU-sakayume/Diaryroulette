<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치·다이내믹 아일랜드 뒤까지 화면을 쓴다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="매일 룰렛이 정해 주는 방식으로 쓰는 일기" />

    <!--
      React가 뜨기 전에 테마를 먼저 정해 첫 화면이 깜빡이지 않게 한다.
      src/theme/theme.ts의 resolveInitialTheme, THEME_COLORS와 같은 규칙이어야 한다.
    -->
    <meta name="theme-color" content="#f6f2ea" id="theme-color-meta" />
    <script>
      (function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') theme = stored
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        document.getElementById('theme-color-meta').setAttribute('content', theme === 'dark' ? '#1b1916' : '#f6f2ea')
      })()
    </script>

    <!-- iOS 홈 화면 앱 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="일기 룰렛" />

    <link rel="icon" type="image/svg+xml" href="/Diaryroulette/favicon.svg" />
    <link rel="apple-touch-icon" href="/Diaryroulette/apple-touch-icon.png" />

    <title>일기 룰렛</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
